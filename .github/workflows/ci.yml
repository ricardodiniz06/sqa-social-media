name: SQA Social Media Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        run: mvn -B --no-transfer-progress test
        working-directory: ./api

  frontend-tests:
    name: Frontend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name: Run Jest Tests
        run: npm run test:coverage -- --watchAll=false
        working-directory: ./client

  e2e-tests:
    name: Playwright E2E & API Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Pre-warm Maven dependencies
        run: mvn -B --no-transfer-progress dependency:go-offline -q
        working-directory: ./api

      - name: Start API
        run: |
          mvn -B --no-transfer-progress spring-boot:run -Dspring-boot.run.profiles=test &
          echo "Waiting for API on port 8080 (max 3 min)..."
          timeout 180 bash -c \
            'until curl -s http://127.0.0.1:8080/auth/signin -o /dev/null 2>&1; do
               printf "."; sleep 4;
             done'
          echo ""
          echo "API is ready!"
        working-directory: ./api

      - name: Start Client
        run: |
          npm ci
          NEXT_PUBLIC_BASE_URL=http://127.0.0.1:8080 npm run build
          NEXT_PUBLIC_BASE_URL=http://127.0.0.1:8080 npm start &
          echo "Waiting for client on port 3000 (max 60s)..."
          timeout 60 bash -c \
            'until curl -s http://127.0.0.1:3000 -o /dev/null 2>&1; do
               printf "."; sleep 3;
             done'
          echo ""
          echo "Client is ready!"
        working-directory: ./client

      - name: Install Playwright Dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
        working-directory: ./tests

      - name: Run Playwright Tests
        run: npm run test
        working-directory: ./tests

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14
